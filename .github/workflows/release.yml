name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    # choco has no Linux build and the GitHub Windows runner ships it;
    # Go cross-compiles every other target from there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: cmd/vulkan/go.mod
          cache-dependency-path: "**/go.sum"

      # go.work is gitignored; the CLI module resolves the root library through it.
      - run: go work init . ./cmd/vulkan ./otel ./.tools

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          # No Chocolatey key yet -> skip that step outright; the cask step
          # gates itself on HOMEBREW_TAP_TOKEN inside the config.
          args: release --clean ${{ secrets.CHOCOLATEY_API_KEY == '' && '--skip=chocolatey' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pins the release to the pushed tag, so a nested-module tag on the
          # same commit (cmd/vulkan/vX.Y.Z) never gets picked instead.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          # Empty until the secrets exist.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
