name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # The integration tests in .tests/integration/ start their own Postgres through
  # testcontainers on the runner's Docker daemon; no service is declared.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - uses: extractions/setup-just@v4

      # go.work is gitignored; the nested modules resolve the root library through it.
      - run: go work init . ./examples ./.bench ./cmd/sqlstreams ./otel ./.tools ./.tests

      # The justfile sets dotenv-required for the compose recipes; verify
      # reads nothing from it.
      - run: touch .env

      - run: just verify
