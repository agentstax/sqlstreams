# Version updates: one grouped PR per ecosystem per month, after a release
# has sat on its registry for a week. Security updates ignore the schedule
# and the cooldown; they open as soon as a fixed version exists, one grouped
# PR per ecosystem when "grouped security updates" is on in the repo's
# code-security settings.
#
# Explicit directories keep the dormant prior-release compatibility module
# out of routine updates.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /cmd/sqlstreams
      - /otel
      - /.bench
      - /.tests
      - /.tools
      - /examples
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /.website
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      website-dependencies:
        patterns:
          - "*"
