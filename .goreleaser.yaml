# Release pipeline for the CLI: builds cmd/sqlstreams on every v* tag, publishes
# the archives to a GitHub Release, then the Homebrew cask for stable tags when
# its token is present. For stable tags with a Chocolatey key, the workflow
# installs and verifies the generated package before submitting it.
#
# Local dry run (needs the repo go.work):
#   goreleaser release --snapshot --clean --skip=publish,chocolatey
version: 2

project_name: sqlstreams
dist: .dist

builds:
  - id: sqlstreams
    # The nested module resolves the root library through go.work, which is
    # gitignored; the workflow generates it before goreleaser runs.
    dir: cmd/sqlstreams
    main: .
    binary: sqlstreams
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: sqlstreams
    ids:
      - sqlstreams
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - cmd/sqlstreams/README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  github:
    owner: allegedlyreliable
    name: sqlstreams
  prerelease: auto

# Homebrew applies the quarantine attribute to cask downloads, so the
# post-install hook strips it until the binary is notarized.
homebrew_casks:
  - name: sqlstreams
    ids:
      - sqlstreams
    binaries:
      - sqlstreams
    homepage: https://sqlstreams.io
    description: CLI for SQLStreams, the Postgres-backed message log
    license: Apache-2.0
    repository:
      owner: allegedlyreliable
      name: homebrew-tap
      branch: main
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_TOKEN" }}auto{{ else }}true{{ end }}'
    commit_msg_template: "sqlstreams {{ .Tag }}"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/sqlstreams"]
          end

chocolateys:
  - name: sqlstreams
    ids:
      - sqlstreams
    package_source_url: https://github.com/allegedlyreliable/sqlstreams
    owners: allegedlyreliable
    title: SQLStreams
    authors: allegedlyreliable
    project_url: https://sqlstreams.io
    license_url: https://github.com/allegedlyreliable/sqlstreams/blob/main/LICENSE
    require_license_acceptance: false
    project_source_url: https://github.com/allegedlyreliable/sqlstreams
    docs_url: https://sqlstreams.io
    bug_tracker_url: https://github.com/allegedlyreliable/sqlstreams/issues
    tags: "sqlstreams postgres messaging cli"
    summary: CLI for SQLStreams, the Postgres-backed message log
    description: |
      {{ .ProjectName }} installer package.
      CLI for SQLStreams, the Postgres-backed message log.
    release_notes: "https://github.com/allegedlyreliable/sqlstreams/releases/tag/{{ .Tag }}"
    # The workflow tests this package against the published GitHub archive,
    # then submits the same nupkg only after installation checks pass.
    skip_publish: true
