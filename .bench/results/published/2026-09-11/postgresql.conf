# Native publication benchmark overrides; PostgreSQL 18.6.
listen_addresses = '127.0.0.1'
port = 55439
max_connections = 200
shared_buffers = '6GB'
work_mem = '32MB'
max_wal_size = '8GB'
min_wal_size = '2GB'
checkpoint_timeout = '5min'
checkpoint_completion_target = 0.9
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
track_wal_io_timing = on
jit = off
fsync = on
synchronous_commit = on
full_page_writes = on
autovacuum = on
