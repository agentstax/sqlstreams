# The reliability lab's own stack: a fresh Postgres, one image, one process
# per role. `just reliability-lab` brings the consumer and observer up, runs
# the producer to the end of its phases, then runs the checker: it loads the
# record files from the shared `records` volume, drains the group, writes its
# results to ./results, and exits with the verdict. The producer and consumer
# are capped at two CPUs each so the generator_headroom check has a cap to
# judge against. The consumer carries no fixed hostname: `--scale consumer=N`
# runs replicas, and each names its records by its container id. The checker sits behind a profile so
# a plain `up` never starts it. Each role's hostname is its record name, so
# keys read `producer-<seq>`. No dependent carries `restart: true` -- a
# Postgres restart during a chaos phase must not restart the roles under
# test.
#
# The postgres service is the one pinned environment every published number
# runs on: image, resource caps, and settings change here and nowhere else,
# and the checker records what the server reports back. PGDATA sits on a
# named volume (never the container's overlay filesystem); `down -v` drops it
# so every run starts from an empty cluster.
name: reliability
services:
  postgres:
    image: postgres:18.4
    command:
      - -c
      - shared_buffers=2560MB
      - -c
      - max_wal_size=4GB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - max_connections=200
    shm_size: 1g
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 8g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab}
      POSTGRES_DB: ${POSTGRES_DB:-lab}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lab} -d ${POSTGRES_DB:-lab}']
      interval: 2s
      timeout: 5s
      retries: 15

  producer:
    build:
      context: ../..
      dockerfile: bench/reliability/Dockerfile
    hostname: producer
    command: ['-role', 'producer', '-scenario', '${SCENARIO:-dev}', '-time-scale', '${TIME_SCALE:-1}', '-record-dir', '/records']
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      SCENARIO_FILE: ${SCENARIO_FILE:-}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab}
      POSTGRES_DB: ${POSTGRES_DB:-lab}
    volumes:
      - records:/records
      - ./results:/results:ro
    depends_on:
      postgres:
        condition: service_healthy

  consumer:
    build:
      context: ../..
      dockerfile: bench/reliability/Dockerfile
    command: ['-role', 'consumer', '-scenario', '${SCENARIO:-dev}', '-time-scale', '${TIME_SCALE:-1}', '-record-dir', '/records']
    deploy:
      resources:
        limits:
          cpus: '2'
    environment:
      SCENARIO_FILE: ${SCENARIO_FILE:-}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab}
      POSTGRES_DB: ${POSTGRES_DB:-lab}
    volumes:
      - records:/records
      - ./results:/results:ro
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 60s

  observer:
    build:
      context: ../..
      dockerfile: bench/reliability/Dockerfile
    hostname: observer
    command: ['-role', 'observer', '-scenario', '${SCENARIO:-dev}', '-time-scale', '${TIME_SCALE:-1}', '-record-dir', '/records']
    environment:
      SCENARIO_FILE: ${SCENARIO_FILE:-}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab}
      POSTGRES_DB: ${POSTGRES_DB:-lab}
    volumes:
      - records:/records
      - ./results:/results:ro
    depends_on:
      postgres:
        condition: service_healthy

  checker:
    build:
      context: ../..
      dockerfile: bench/reliability/Dockerfile
    profiles: [checker]
    command: ['-role', 'checker', '-scenario', '${SCENARIO:-dev}', '-time-scale', '${TIME_SCALE:-1}', '-record-dir', '/records', '-results-dir', '/results', '-fingerprint-file', '/results/fingerprint.json', '-stats-file', '/results/stats.jsonl', '-drain-budget', '${DRAIN_BUDGET:-2m}']
    environment:
      SCENARIO_FILE: ${SCENARIO_FILE:-}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab}
      POSTGRES_DB: ${POSTGRES_DB:-lab}
    volumes:
      - records:/records
      - ./results:/results
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  records:
  pgdata:
